name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm ci --prefix server
      - run: npm run e2e:sharing
      - name: Upload e2e failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-reports
          path: e2e/artifacts/
          if-no-files-found: ignore
  server-dynamodb:
    # the API tests again, on DynamoDB Local instead of the in-memory store
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix server
      - run: npx vitest run server
        env:
          TEST_REPO: dynamodb
          DYNAMODB_ENDPOINT: http://localhost:8000
